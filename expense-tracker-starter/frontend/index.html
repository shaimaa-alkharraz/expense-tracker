<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar bg-dark" data-bs-theme="dark">
  <div class="container">
    <span class="navbar-brand mb-0 h1">Expense Tracker</span>

    <button id="darkModeBtn" class="btn btn-outline-light">
      Dark Mode
    </button>
  </div>
</nav>

<!-- Alerts -->

<div id="alertContainer" class="container mt-3"></div>

<!-- Loading Spinner -->
<div id="loadingSpinner" class="text-center d-none mt-3">
  <div class="spinner-border" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<div class="container mt-4">
<div class="summary-grid">

  <div class="card text-center">
    <div class="card-body">
      <h5 class="card-title">Total Amount</h5>
      <p class="card-text" id="totalAmount">$0</p>
    </div>
  </div>

  <div class="card text-center">
    <div class="card-body">
      <h5 class="card-title">Number of Expenses</h5>
      <p class="card-text" id="expenseCount">0</p>
    </div>
  </div>

  <div class="card text-center">
    <div class="card-body">
      <h5 class="card-title">Highest Expense</h5>
      <p class="card-text" id="highestExpense">$0</p>
    </div>
  </div>

</div>
<h3 class="mt-4">Add Expense</h3>

<form id="expenseForm" class="row g-3">

  <div class="col-md-3">
    <label for="title" class="form-label">Title</label>
    <input type="text" class="form-control" id="title" required>
  </div>

  <div class="col-md-3">
    <label for="amount" class="form-label">Amount</label>
    <input type="number" class="form-control" id="amount" step="0.01" min="0.01" required>
  </div>

  <div class="col-md-3">
    <label for="category" class="form-label">Category</label>
    <select class="form-select" id="category" required>
      <option value="">Choose...</option>
      <option value="Food">Food</option>
      <option value="Transport">Transport</option>
      <option value="Bills">Bills</option>
      <option value="Entertainment">Entertainment</option>
      <option value="Other">Other</option>
    </select>
  </div>

  <div class="col-md-3">
    <label for="date" class="form-label">Date</label>
    <input type="date" class="form-control" id="date" required>
  </div>

  <div class="col-12">
    <button type="submit" class="btn btn-primary">Add Expense</button>
  </div>

</form>
<!-- Filter -->
<div class="mt-4">
  <label for="categoryFilter" class="form-label">Filter by Category</label>

  <select id="categoryFilter" class="form-select">
    <option value="All">All</option>
    <option value="Food">Food</option>
    <option value="Transport">Transport</option>
    <option value="Bills">Bills</option>
    <option value="Entertainment">Entertainment</option>
    <option value="Other">Other</option>
  </select>

</div>

<div class="mt-3">
  <label for="searchInput" class="form-label">Search by Title</label>

  <input
    type="text"
    id="searchInput"
    class="form-control"
    placeholder="Search expenses..."
  >
</div>

<!-- Expenses Table -->
<div class="mt-4">
  <h3>Expenses</h3>

  <div class="table-responsive">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Title</th>
          <th>Amount</th>
          <th>Category</th>
          <th>Date</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="expenseTableBody">
      </tbody>
    </table>
  </div>
</div>
</div>

  <!-- PHASE 2: build the page here.

       Your backend (Phase 1) is already running with real data in it,
       so build this page straight against the API - there is no
       in-memory or localStorage stage this time.

       1. Navbar
       2. Summary cards: total amount, number of expenses, highest expense
       3. Form to add an expense: title, amount, category (select), date
       4. Filter by category (with an "All" option)
       5. Table: title, amount, category, date, an edit button, a delete button

       Remember: the table rows must be built with JavaScript (DOM),
       not written by hand in this file. -->

       <!-- Edit Expense Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Edit Expense</h5>
        <button type="button"
                class="btn-close"
                data-bs-dismiss="modal">
        </button>
      </div>

      <div class="modal-body">

        <form id="editForm">

          <input type="hidden" id="editId">

          <div class="mb-3">
            <label for="editTitle" class="form-label">Title</label>
            <input type="text"
                   class="form-control"
                   id="editTitle"
                   required>
          </div>

          <div class="mb-3">
            <label for="editAmount" class="form-label">Amount</label>
            <input type="number"
                   class="form-control"
                   id="editAmount"
                   step="0.01"
                   min="0.01"
                   required>
          </div>

          <div class="mb-3">
            <label for="editCategory" class="form-label">Category</label>

            <select class="form-select"
                    id="editCategory"
                    required>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="editDate" class="form-label">Date</label>
            <input type="date"
                   class="form-control"
                   id="editDate"
                   required>
          </div>

        </form>

      </div>

      <div class="modal-footer">

        <button type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal">
          Cancel
        </button>

        <button type="submit"
                form="editForm"
                class="btn btn-primary">
          Save Changes
        </button>

      </div>

    </div>
  </div>
</div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
